# GoReleaser builds and publishes releases. It runs in the release workflow;
# locally, 'make release-check' validates this file and 'make snapshot' builds
# everything into dist/ without publishing.
version: 2

project_name: azskufinder

before:
  hooks:
    # Shell completions, shipped in the archives and installed by Homebrew.
    - sh -c 'mkdir -p completions && for sh in bash zsh fish powershell; do go run ./cmd/azskufinder completion "$sh" > "completions/azskufinder.$sh"; done'

builds:
  - id: azskufinder
    main: ./cmd/azskufinder
    binary: azskufinder
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    # Keep in step with LDFLAGS in the Makefile. Only the version is injected;
    # Go records the commit and its time in the binary itself.
    ldflags:
      - -s -w -X main.version={{ .Version }}
    # The commit's time rather than the build's, so builds are reproducible.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: azskufinder
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - completions/*

snapshot:
  # make snapshot: the next patch version, marked as a snapshot of this commit.
  version_template: "{{ incpatch .Version }}-SNAPSHOT-{{ .ShortCommit }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

# One SPDX SBOM per binary, generated by Trivy from the module list Go embeds
# in it. --config /dev/null stops it reading the scan settings in trivy.yaml.
sboms:
  - id: binaries
    artifacts: binary
    documents:
      - "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}.sbom.json"
    cmd: trivy
    args:
      - rootfs
      - --config=/dev/null
      - --quiet
      - --skip-version-check
      - --format=spdx-json
      - --output=$document
      - $artifact

changelog:
  # git rather than github, so 'make snapshot' works without a token. With
  # merge commits, this lists the individual commits behind each merge.
  use: git
  sort: asc
  filters:
    exclude:
      - "^Merge "
      - "^(build|chore|ci|docs|refactor|revert|style|test)(\\(.+\\))?:"
  groups:
    - title: Breaking changes
      regexp: '^\w+(\(.+\))?!:'
      order: 0
    - title: Features
      regexp: '^feat(\(.+\))?:'
      order: 1
    - title: Bug fixes
      regexp: '^fix(\(.+\))?:'
      order: 2
    - title: Performance
      regexp: '^perf(\(.+\))?:'
      order: 3
    - title: Other
      order: 999

release:
  github:
    owner: mike-guy
    name: azskufinder
  name_template: "v{{ .Version }}"
  footer: |
    ## Installing

    ```sh
    brew install mike-guy/tap/azskufinder          # macOS and Linux
    scoop bucket add mike-guy https://github.com/mike-guy/scoop-bucket
    scoop install mike-guy/azskufinder              # Windows
    go install github.com/mike-guy/azskufinder/cmd/azskufinder@{{ .Tag }}
    ```

    ## Verifying a download

    ```sh
    gh attestation verify <archive> --repo mike-guy/azskufinder
    gh attestation verify <archive> --bundle azskufinder_{{ .Version }}.sigstore.json --repo mike-guy/azskufinder
    sha256sum --check --ignore-missing checksums.txt
    ```

homebrew_casks:
  - name: azskufinder
    repository:
      owner: mike-guy
      name: homebrew-tap
      # Repository tokens accept only a bare {{ .Env.NAME }}: no functions.
      # It's read only when publishing, so 'make snapshot' works without it.
      token: "{{ .Env.HOMEBREW_SCOOP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/mike-guy/azskufinder
    description: Find the Azure VM sizes you can actually deploy
    license: MIT
    commit_msg_template: "chore: update {{ .ProjectName }} to {{ .Tag }}"
    completions:
      bash: completions/azskufinder.bash
      zsh: completions/azskufinder.zsh
      fish: completions/azskufinder.fish
    # The binaries aren't notarised by Apple, so remove the quarantine flag
    # that would otherwise make macOS refuse to run it.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/azskufinder"]
          end

scoops:
  - name: azskufinder
    repository:
      owner: mike-guy
      name: scoop-bucket
      token: "{{ .Env.HOMEBREW_SCOOP_TOKEN }}"
    directory: bucket
    homepage: https://github.com/mike-guy/azskufinder
    description: Find the Azure VM sizes you can actually deploy
    license: MIT
    commit_msg_template: "chore: update {{ .ProjectName }} to {{ .Tag }}"
