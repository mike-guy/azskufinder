name: renovate

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays, 05:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    environment: renovate
    # The job uses the App's token, not GITHUB_TOKEN.
    permissions: {}
    steps:
      - name: Create App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: azskufinder
          # Only what Renovate needs, even if the App is given more later.
          permission-contents: write # push update branches
          permission-pull-requests: write # open and update pull requests
          permission-issues: write # the Dependency Dashboard issue
          permission-workflows: write # update actions in workflow files
          permission-checks: read
          permission-statuses: read
          permission-vulnerability-alerts: read # raise security updates first
      - name: Run Renovate
        uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_PLATFORM_COMMIT: enabled
          LOG_LEVEL: info
